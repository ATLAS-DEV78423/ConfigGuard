name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    name: lint + format + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy rice

  tests:
    name: unit/cli/security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest tests/unit tests/cli tests/security -q

  integration:
    name: integration + recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest tests/integration tests/recovery -q

  debian:
    name: Debian 13 (trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip python3-venv
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -e .[dev]
          .venv/bin/pytest tests/unit tests/cli -q
